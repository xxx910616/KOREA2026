<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KOREA.2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(180deg, #eef3f7 0%, #f8fbfc 100%);
            --card-bg: #ffffff;
            --accent-blue: #7a92a5;
            --text-main: #4a5568;
            --text-light: #94a3b8;
            --tag-bg: #f1f5f9;
            --active-yellow: #fff9c4;
            --shadow: 0 10px 25px rgba(149, 157, 165, 0.08);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

        body {
            font-family: 'Poppins', 'Noto Sans TC', sans-serif;
            background: var(--bg-gradient);
            margin: 0; padding: 0; color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container { max-width: 480px; margin: 0 auto; padding: 30px 15px 100px 15px; }

        header { text-align: center; margin-bottom: 25px; }
        header h1 { font-size: 26px; font-weight: 700; color: var(--accent-blue); margin: 0; letter-spacing: 2px; }
        header p { font-size: 12px; color: var(--text-light); margin-top: 5px; }

        .nav-scroller {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 30px; padding: 5px;
            display: flex; justify-content: space-between;
            position: sticky; top: 15px; z-index: 1000;
            box-shadow: var(--shadow); margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.3);
            overflow-x: auto;
            scrollbar-width: none;
        }
        .nav-scroller::-webkit-scrollbar { display: none; }

        .nav-btn {
            border: none; background: none; flex-shrink: 0;
            padding: 10px 15px; font-size: 12px; font-weight: 700;
            color: var(--text-light); border-radius: 25px;
            cursor: pointer; transition: all 0.2s ease;
            text-align: center;
        }
        .nav-btn span { display: block; font-size: 9px; opacity: 0.7; font-weight: 400; }

        .nav-btn.active { 
            background: var(--active-yellow); color: #5a6a7a;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .filter-scroller {
            display: flex; gap: 8px; overflow-x: auto;
            margin-bottom: 15px; padding-bottom: 5px;
            scrollbar-width: none;
        }
        .filter-scroller::-webkit-scrollbar { display: none; }
        .filter-chip {
            white-space: nowrap; padding: 6px 14px; border-radius: 20px;
            background: #fff; border: 1px solid #e2e8f0; font-size: 12px;
            color: #64748b; cursor: pointer; transition: all 0.2s;
        }
        .filter-chip.active {
            background: var(--accent-blue); color: white; border-color: var(--accent-blue);
        }

        .card {
            background: var(--card-bg); border-radius: 30px; padding: 20px;
            box-shadow: var(--shadow); margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.5);
        }

        .section-header { 
            font-size: 15px; font-weight: 700; color: var(--accent-blue); 
            margin-bottom: 18px; display: flex; align-items: center; gap: 8px;
        }

        .item-list { display: flex; flex-direction: column; gap: 10px; min-height: 50px; }

        .item-row {
            background: white; border-radius: 20px; padding: 14px;
            display: flex; align-items: center; gap: 10px;
            border: 1px solid #f1f5f9; cursor: pointer; position: relative;
            transition: transform 0.1s;
        }
        .sortable-ghost { opacity: 0.4; background: #e2e8f0; }

        .drag-handle { 
            color: #cbd5e1; 
            padding: 5px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .drag-handle span { width: 12px; height: 2px; background: #cbd5e1; border-radius: 2px; }

        .time-label { font-size: 13px; font-weight: 700; color: var(--accent-blue); width: 45px; flex-shrink: 0; }
        .content-box { flex: 1; min-width: 0; }
        .item-name { font-size: 14px; font-weight: 600; color: #334155; margin-bottom: 3px; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-desc { font-size: 11px; color: var(--text-light); line-height: 1.3; }
        
        .tag-row { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
        .tag {
            background: var(--tag-bg); color: #64748b; padding: 2px 8px;
            border-radius: 6px; font-size: 10px; font-weight: 700;
            display: inline-flex; align-items: center; gap: 3px;
        }
        .emoji-icon { font-size: 20px; flex-shrink: 0; }

        .sheet-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px); display: none; z-index: 2000;
            align-items: flex-end;
        }
        .sheet {
            background: white; width: 100%; border-radius: 30px 30px 0 0;
            padding: 25px; animation: slideUp 0.3s ease; max-width: 480px; margin: 0 auto;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .sheet-title { font-size: 16px; font-weight: 700; color: var(--accent-blue); margin-bottom: 20px; text-align: center; }
        .sheet-options { display: flex; flex-direction: column; gap: 10px; }
        .sheet-btn {
            width: 100%; padding: 15px; border-radius: 16px; border: none;
            font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer;
        }
        .btn-nav { background: #e0f2fe; color: #0369a1; }
        .btn-cancel { background: #f1f5f9; color: #64748b; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>KOREA.2026</h1>
        <p>2026.04.25 - 04.29</p>
    </header>

    <nav class="nav-scroller" id="main-nav">
        <button class="nav-btn active" data-tab="start">準備</button>
        <button class="nav-btn" data-tab="1">D1<span>4/25</span></button>
        <button class="nav-btn" data-tab="2">D2<span>4/26</span></button>
        <button class="nav-btn" data-tab="3">D3<span>4/27</span></button>
        <button class="nav-btn" data-tab="4">D4<span>4/28</span></button>
        <button class="nav-btn" data-tab="5">D5<span>4/29</span></button>
        <button class="nav-btn" data-tab="heart"><i class="fa-solid fa-heart"></i></button>
    </nav>

    <div id="content-area"></div>
</div>

<div class="sheet-overlay" id="sheet-overlay">
    <div class="sheet">
        <div class="sheet-title" id="sheet-name">項目名稱</div>
        <div class="sheet-options">
            <button class="sheet-btn btn-nav" id="sheet-nav-btn"><i class="fa-solid fa-location-arrow"></i> 導航 (Naver Map)</button>
            <button class="sheet-btn btn-cancel" onclick="closeSheet()">關閉</button>
        </div>
    </div>
</div>

<script>
    const appData = {
        start: [

            { id: 's2', name: '換韓幣', detail: '在台灣換 10 萬韓幣，另備5千-1萬台幣備用', emoji: '💰' },
            { id: 's3', name: '刷卡須知', detail: '手續費 1.5%，滿 ₩30000 可退稅', emoji: '💳' },
            { id: 's4', name: '藝人韓服', detail: '預約 TWD 245/人', emoji: '👘' },
            { id: 's5', name: '愛寶樂園門票', detail: '預約 TWD 705/人', emoji: '🎢' },
            { id: 's6', name: 'ESIM 自備', detail: '$279/人', emoji: '📱' },
            { id: 's7', name: '飯店 Aank Hotel Yeongdengpo branch', address: '서울 영등포구 영중로10길 10', emoji: '🏨' }
        ],
        days: {
            1: [
                { id: 'd1-1', time: '21:35', name: '抵達仁川', emoji: '🛫', detail: '辦理出關' },
                { id: 'd1-2', time: '22:30', name: '飯店 Check-in', emoji: '🏨', transport: '機場接送', money: '₩13000/人' },
                { id: 'd1-3', time: '23:00', name: 'Oliveyoung Dootamall', emoji: '🪞', address: '서울 중구 장충단로 275 두산타워 B2층', transport: '夜間公車/UBER' },
                { id: 'd1-4', time: '00:00', name: 'The mask shop', emoji: '🛍️', address: '서울 중구 퇴계로73길 36 1층', transport: '夜間公車/UBER' },
                { id: 'd1-5', time: '01:00', name: '大成精肉店 대성정육식당', emoji: '🥩', address: '서울 용산구 보광동 63-2', transport: '夜間公車/UBER' },
                { id: 'd1-6', time: '02:30', name: '飯店', emoji: '🏨', transport: '夜間公車/UBER' }
            ],
            2: [
                { id: 'd2-1', time: '09:00', name: '藝人韓服 연예인 한복', emoji: '👘', address: '서울 종로구 체부동 60-2', transport: '地鐵1+3' },
                { id: 'd2-3', time: '11:30', name: 'Olive Better', emoji: '🍒', address: '서울 종로구 청진동 246', transport: '🚶🏻‍➡️' },
                { id: 'd2-4', time: '12:30', name: '順美家幸福的醬蟹 순미네행복게장 동대문', emoji: '🦀', address: '서울 中區 乙支路6街 18-37', transport: '地鐵3+2' },
                { id: 'd2-5', time: '15:30', name: '廣藏市場 광장시장', emoji: '🍢', address: '서울 종로구 예지동 2-1', transport: '🚶🏻‍➡️' },
                { id: 'd2-6', time: '16:30', name: '明洞', emoji: '🏙️', address: '서울 中區 小公洞 1', transport: '地鐵1+4' },
                { id: 'd2-7', time: '18:30', name: '樂天超市 롯데마트 서울역점', emoji: '🛒', address: '서울특별시 中區 靑波路 426', transport: '地鐵4' },
                { id: 'd2-8', time: '20:00', name: '明倫進士燒烤 명륜진사갈비 영등포역점', emoji: '🥩', address: '서울 영등포구 영등포동3가 16-2', transport: '🚶🏻‍➡️' },
                { id: 'd2-9', time: '20:00', name: '飯店', emoji: '🏨', transport: '🚶🏻‍➡️' }
            ],
            3: [
                { id: 'd3-1', time: '10:00', name: '安木豬肉湯飯 성수', emoji: '🐷', address: '서울 성동구 뚝섬로13길 34 1층', transport: '地鐵1+2' },
                { id: 'd3-2', time: '12:00', name: '聖水洞 성수동', emoji: '☕', address: '서울 성동구 성수동', transport: '🚶🏻‍➡️' },
                { id: 'd3-3', time: '15:00', name: 'JOJO刀削麵', emoji: '🍜', address: '서울 성동구 성수동2가 289-257', transport: '🚶🏻‍➡️' },
                { id: 'd3-4', time: '18:00', name: '漢南洞 한남동', emoji: '🚇', address: '서울 용산구 한남동', transport: '地鐵2+6' },
                { id: 'd3-4b', time: '20:00', name: 'GOP牛腸 강남곱', emoji: '🥘', address: '서울 강남구 역삼로3길 12', transport: '公車/UBER' },
                { id: 'd3-5', time: '22:00', name: '飯店', emoji: '🏨', transport: '地鐵6+5' }
            ],
            4: [
                { id: 'd4-1', time: '08:00', name: '愛寶樂園 에버랜드', emoji: '🎢', address: '경기도 용인시 처인구 포곡읍 에버랜드로 199', transport: '專車' },
                { id: 'd4-2', time: '15:00', name: '醫美 닥터디자이너의원 명동점', emoji: '🏥', address: '서울 중구 명동8가길 7', transport: '專車' },
                { id: 'd4-3', time: '17:00', name: '望遠>汝矣島 漢江夜景', emoji: '🚢', address: '서울 마포구 마포나루길 442', transport: '🚢' },
                { id: 'd4-4', time: '17:00', name: '備案 弘大', emoji: '🛍️', address: '서울 마포구 동교동 165-5', transport: '地鐵2' },
                { id: 'd4-5', time: '18:30', name: '汝矣島 No Brand 노브랜드', emoji: '🏪', address: '서울 영등포구 여의도동 17-3', transport: '🚶🏻‍➡️' },
                { id: 'd4-6', time: '19:30', name: '二高家的小章魚 이고집쭈꾸미', emoji: '🐙', address: '서울 영등포구 영등포동3가 11-11', transport: '公車/UBER' },
                { id: 'd4-7', time: '20:30', name: '飯店', emoji: '🏨', transport: '🚶🏻‍➡️' }
            ],
            5: [
                { id: 'd5-1', time: '10:30', name: '出發往機場', emoji: '🛫', transport: '機場接送', detail: '準備返台' },
                { id: 'd5-2', time: '14:45', name: '搭機返台', emoji: '✈️', detail: '航班回程' }
            ]
        },
        heart: [
            { id: 'h1', name: '聖水洞 ONGO 온고', emoji: '👒', address: '서울 성동구 성수동2가 301-64' },
            { id: 'h2', name: '延南洞 CU甜點公園', emoji: '🌳', address: '서울 마포구 연남동' },
            { id: 'h3', name: '聖水洞 MAMAN GELATO', emoji: '🍦', address: '서울 성동구 성수동2가 315-18' },
            { id: 'h4', name: '聖水洞 Milky Shop', emoji: '🍪', address: '서울 성동구 성수동2가 301-52' },
            { id: 'h5', name: '明洞 FRESH BREAD FACTORY', emoji: '🥐', address: '서울 중구 명동1가 34-1' },
            { id: 'h6', name: '明洞 烤起司年糕', emoji: '🧀', address: '서울 중구 명동1가 61-2' },
            { id: 'h7', name: '明洞 大創旗艦店', emoji: '📃', address: '서울 중구 퇴계로 134-1' },
            { id: 'h8', name: '明洞 明朗熱狗', emoji: '🌭', address: '서울 중구 명동2가 101-3' },
            { id: 'h9', name: '弘大 chung chung', emoji: '👖', address: '서울 마포구 서교동 365-26' }
        ]
    };

    let activeTab = 'start';
    let currentFilter = '全部';

    function render() {
        const area = document.getElementById('content-area');
        area.innerHTML = '';
        
        if (activeTab === 'heart') {
            const filterDiv = document.createElement('div');
            filterDiv.className = 'filter-scroller';
            const categories = ['全部', '聖水洞', '明洞', '弘大', '延南洞'];
            categories.forEach(cat => {
                const chip = document.createElement('div');
                chip.className = `filter-chip ${currentFilter === cat ? 'active' : ''}`;
                chip.innerText = cat;
                chip.onclick = () => {
                    currentFilter = cat;
                    render();
                };
                filterDiv.appendChild(chip);
            });
            area.appendChild(filterDiv);
        }

        const card = document.createElement('div');
        card.className = 'card';

        let headerTxt = '';
        if (activeTab === 'start') headerTxt = '行前備忘';
        else if (activeTab === 'heart') headerTxt = '收藏清單';
        else headerTxt = `Day ${activeTab} 行程`;

        card.innerHTML = `<div class="section-header"><i class="fa-solid fa-calendar-day"></i> ${headerTxt}</div>`;

        const list = document.createElement('div');
        list.className = 'item-list';
        
        let items = (activeTab === 'start' || activeTab === 'heart') ? appData[activeTab] : appData.days[activeTab];
        
        if (activeTab === 'heart' && currentFilter !== '全部') {
            items = items.filter(i => 
                (i.name && i.name.includes(currentFilter)) || 
                (i.address && i.address.includes(currentFilter))
            );
        }

        items.forEach((item) => {
            const row = document.createElement('div');
            row.className = 'item-row';
            row.onclick = () => openSheet(item);
            row.innerHTML = `
                <div class="drag-handle"><span></span><span></span><span></span></div>
                ${item.time && activeTab !== 'start' ? `<div class="time-label">${item.time}</div>` : ''}
                <div class="content-box">
                    <div class="item-name">${item.name}</div>
                    ${item.detail ? `<div class="item-desc">${item.detail}</div>` : ''}
                    <div class="tag-row">
                        ${item.transport ? `<span class="tag"><i class="fa-solid fa-bus"></i> ${item.transport}</span>` : ''}
                        ${item.money ? `<span class="tag"><i class="fa-solid fa-won-sign"></i> ${item.money}</span>` : ''}
                    </div>
                </div>
                <div class="emoji-icon">${item.emoji || '📍'}</div>
            `;
            list.appendChild(row);
        });

        card.appendChild(list);
        area.appendChild(card);
        new Sortable(list, { handle: '.drag-handle', animation: 200 });
    }

    function openSheet(item) {
        document.getElementById('sheet-name').innerText = item.name;
        document.getElementById('sheet-overlay').style.display = 'flex';

        document.getElementById('sheet-nav-btn').onclick = () => {
            if (!item.address) {
                alert("此項目無地址資訊");
            } else {
                window.open(`https://map.naver.com/v5/search/${encodeURIComponent(item.address)}`, '_blank');
            }
            closeSheet();
        };
    }

    function closeSheet() { document.getElementById('sheet-overlay').style.display = 'none'; }

    document.getElementById('main-nav').onclick = (e) => {
        const btn = e.target.closest('.nav-btn');
        if (!btn) return;
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeTab = btn.dataset.tab;
        currentFilter = '全部';
        render();
    };

    window.onclick = (e) => {
        if (e.target.id === 'sheet-overlay') closeSheet();
    };

    window.onload = render;
</script>

</body>
</html>
