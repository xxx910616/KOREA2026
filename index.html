<!DOCTYPE html>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase 配置與初始化
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'korea-travel-2026-v4';

        // 狀態管理
        let state = {
            appData: null,
            activeTab: '1',
            currentIndex: -1,
            currentUser: null
        };

        const initialData = {
            start: [
                { id: 's1', name: '自備插座轉接頭', detail: '圓形 4.8mm 雙孔', emoji: '🔌' },

                { id: 's3', name: '刷卡須知', detail: '手續費 1.5%，滿 ₩30000 可退稅', emoji: '💳' },
                { id: 's4', name: '藝人韓服', detail: '預約 TWD 245/人', emoji: '👘' },
                { id: 's5', name: '愛寶樂園門票', detail: '預約 TWD 705/人', emoji: '🎢' },
                { id: 's6', name: 'ESIM (5天10G)', detail: '$279/人', emoji: '📱' },
                { id: 's7', name: '飯店: Aank Hotel', address: '서울 영등포구 영중로10길 10', emoji: '🏨' }
            ],
            days: {
                1: [
                    { id: 'd1-1', time: '21:35', name: '抵達仁川', emoji: '🛫' },
                    { id: 'd1-2', time: '22:30', name: '飯店 Check-in', emoji: '🏨', transport: '機場接送', money: '₩13000/人' },
                    { id: 'd1-3', time: '23:00', name: 'Oliveyoung Dootamall', emoji: '🪞', address: '서울 中구 장충단로 275 두산塔워 B2층', transport: '夜間公車/UBER' },
                    { id: 'd1-4', time: '00:00', name: '東大門', emoji: '🛍️', address: '서울 중구 퇴계로73길 36 1層', transport: '夜間公車/UBER' },
                    { id: 'd1-5', time: '01:00', name: '大成精肉店 대성정육식당', emoji: '🥩', address: '서울 용산구 보광動 63-2', transport: '夜間公車/UBER' },
                    { id: 'd1-6', time: '02:30', name: '回飯店休息', emoji: '🛌', transport: '夜間公車/UBER' }
                ],
                2: [
                    { id: 'd2-1', time: '09:00', name: '景福宮 경복궁', emoji: '🏛️', address: '서울 종로구 세종로 1-1', transport: '地鐵5+3' },
                    { id: 'd2-2', time: '10:00', name: '藝人韓服', emoji: '👘', address: '서울 종로구 체부동 60-2', transport: '🚶🏻‍➡️' },
                    { id: 'd2-3', time: '11:30', name: 'Olive Better', emoji: '🍒', address: '서울 종로구 청진동 246', transport: '🚶🏻‍➡️' },
                    { id: 'd2-4', time: '12:30', name: '順美家幸福的醬蟹 순미네행복게장', emoji: '🦀', address: '서울 中구 을지로6가 18-37', transport: '地鐵3+2' },
                    { id: 'd2-5', time: '15:30', name: '廣藏市場 광장시장', emoji: '🍢', address: '서울 종路구 예지동 2-1', transport: '🚶🏻‍➡️' },
                    { id: 'd2-6', time: '16:30', name: '明洞 명동', emoji: '🏙️', transport: '地鐵1+4' },
                    { id: 'd2-7', time: '16:00', name: '樂天百貨 本店', emoji: '🛍️', address: '서울 중구 소공동 1', transport: '🚶🏻‍➡️' },
                    { id: 'd2-8', time: '18:30', name: '首爾車站樂天超市', emoji: '🛒', address: '서울특별시 중구 청파로 426', transport: '地鐵4' },
                    { id: 'd2-9', time: '20:00', name: '明倫進士燒烤 명륜진사갈비', emoji: '🥩', address: '서울 영등포구 영등포동3가 16-2', transport: '🚶🏻‍➡️' },
                    { id: 'd2-10', time: '21:00', name: '飯店', emoji: '🏨' }
                ],
                3: [
                    { id: 'd3-1', time: '10:00', name: '漢南洞 한남洞', emoji: '🚇', transport: '地鐵5+6' },
                    { id: 'd3-2', time: '12:00', name: '安木豬肉湯飯 안목 성수국밥', emoji: '🐷', address: '서울 성동구 뚝섬로13길 34 1層', transport: '地鐵6+2' },
                    { id: 'd3-3', time: '13:30', name: '聖水洞 성수동', emoji: '☕', transport: '🚶🏻‍➡️' },
                    { id: 'd3-4', time: '18:00', name: 'JOJO刀削麵 조조칼국수', emoji: '🍜', address: '서울 성동구 성수동2가 289-257', transport: '🚶🏻‍➡️' },
                    { id: 'd3-5', time: '21:00', name: '飯店', emoji: '🏨', transport: '地鐵2+5' }
                ],
                4: [
                    { id: 'd4-1', time: '10:00', name: '愛寶樂園 에버랜드', emoji: '🎢', transport: '專車' },
                    { id: 'd4-2', time: '16:00', name: '醫美行程 (弘大)', emoji: '🏥', transport: '專車' },
                    { id: 'd4-3', time: '18:00', name: 'Hongs Zzuggumi 辣炒章魚', emoji: '🐙', transport: '專車' },
                    { id: 'd4-4', time: '19:00', name: '望遠碼頭搭船遊漢江', emoji: '🚢', address: '서울 마포구 마포나루길 442', transport: '專車' },
                    { id: 'd4-5', time: '21:00', name: '汝矣島NO Brand', emoji: '🛒', address: '서울 영등포구 여의도動 17-3', transport: '公車/UBER' },
                    { id: 'd4-6', time: '22:30', name: 'GOP牛腸 강남곱', emoji: '🥘', address: '서울 강남구 역삼로3길 12' }
                ],
                5: [
                    { id: 'd5-1', time: '10:30', name: '出發往機場 🛫', emoji: '✈️' },
                    { id: 'd5-2', time: '14:45', name: '搭機返台', emoji: '🇹🇼', detail: '航班回程' }
                ]
            },
            heart: [
                { id: 'h1', name: '延南洞咖啡廳', emoji: '☕', address: '서울 마포구 연남동', detail: '口袋名單中的文青店' },
                { id: 'h2', name: '汝矣島漢江野餐', emoji: '🧺', address: '서울 영등포구 여의동로 330', detail: '晚上在江邊吃炸雞配泡麵' },
                { id: 'h3', name: '首爾塔看夜景', emoji: '🗼', address: '서울 용산구 남산공원길 105', detail: '必拍的經典場景' }
            ]
        };

        async function saveToCloud() {
            if (!state.currentUser || !state.appData) return;
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'itinerary', 'main');
            await setDoc(docRef, state.appData);
        }

        function render() {
            const area = document.getElementById('content-area');
            if (!state.appData) {
                area.innerHTML = '<div class="loading">正在連線至雲端...</div>';
                return;
            }
            area.innerHTML = '';
            
            const card = document.createElement('div');
            card.className = 'card';
            let headerTxt = state.activeTab === 'start' ? '行前備忘' : state.activeTab === 'heart' ? '<i class="fa-solid fa-heart" style="color:#E74C3C;"></i> 收藏清單' : `Day ${state.activeTab}`;
            card.innerHTML = `<div class="section-header">${headerTxt}</div>`;

            const list = document.createElement('div');
            list.className = 'item-list';
            let items = (state.activeTab === 'start' || state.activeTab === 'heart') ? state.appData[state.activeTab] : state.appData.days[state.activeTab];
            
            if (!items || items.length === 0) {
                list.innerHTML = `<div class="empty-state">目前沒有項目</div>`;
            } else {
                items.forEach((item, idx) => {
                    const row = document.createElement('div');
                    row.className = 'item-row';
                    row.innerHTML = `
                        <div class="drag-handle"><span></span><span></span><span></span></div>
                        ${item.time && state.activeTab !== 'start' && state.activeTab !== 'heart' ? `<div class="time-label">${item.time}</div>` : ''}
                        <div class="content-box">
                            <div class="item-name">${item.name}</div>
                            <div class="item-desc">${item.detail || item.address || ''}</div>
                            <div class="tag-row">
                                ${item.transport ? `<span class="tag"><i class="fa-solid fa-bus"></i> ${item.transport}</span>` : ''}
                                ${item.money ? `<span class="tag"><i class="fa-solid fa-won-sign"></i> ${item.money}</span>` : ''}
                            </div>
                        </div>
                        <div class="emoji-icon">${item.emoji || '📍'}</div>
                    `;
                    row.onclick = (e) => {
                        if (e.target.closest('.drag-handle')) return;
                        openSheet(idx, item);
                    };
                    list.appendChild(row);
                });
            }
            card.appendChild(list);
            area.appendChild(card);
            
            new Sortable(list, { 
                handle: '.drag-handle', animation: 200, ghostClass: 'sortable-ghost',
                onEnd: (evt) => {
                    const arr = (state.activeTab === 'start' || state.activeTab === 'heart') ? state.appData[state.activeTab] : state.appData.days[state.activeTab];
                    const [moved] = arr.splice(evt.oldIndex, 1);
                    arr.splice(evt.newIndex, 0, moved);
                    saveToCloud();
                }
            });
        }

        window.switchTab = (tab) => {
            state.activeTab = tab;
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
            render();
        };

        window.openEdit = (idx = -1) => {
            state.currentIndex = idx;
            const arr = (state.activeTab === 'start' || state.activeTab === 'heart') ? state.appData[state.activeTab] : state.appData.days[state.activeTab];
            const item = idx === -1 ? { name: '', emoji: '📍' } : arr[idx];
            
            document.getElementById('in-name').value = item.name || '';
            document.getElementById('in-emoji').value = item.emoji || '';
            document.getElementById('in-time').value = item.time || '';
            document.getElementById('in-address').value = item.address || '';
            document.getElementById('in-transport').value = item.transport || '';
            document.getElementById('in-money').value = item.money || '';
            document.getElementById('in-detail').value = item.detail || '';
            
            document.getElementById('modal-overlay').style.display = 'flex';
        };

        window.saveEdit = async () => {
            const name = document.getElementById('in-name').value;
            if (!name) return;
            const arr = (state.activeTab === 'start' || state.activeTab === 'heart') ? state.appData[state.activeTab] : state.appData.days[state.activeTab];
            const updated = {
                id: state.currentIndex === -1 ? Date.now().toString() : arr[state.currentIndex].id,
                name: name,
                emoji: document.getElementById('in-emoji').value,
                time: document.getElementById('in-time').value,
                address: document.getElementById('in-address').value,
                transport: document.getElementById('in-transport').value,
                money: document.getElementById('in-money').value,
                detail: document.getElementById('in-detail').value
            };
            if (state.currentIndex === -1) arr.push(updated);
            else arr[state.currentIndex] = updated;
            await saveToCloud();
            closeModal();
        };

        window.deleteItem = async (idx) => {
            const arr = (state.activeTab === 'start' || state.activeTab === 'heart') ? state.appData[state.activeTab] : state.appData.days[state.activeTab];
            arr.splice(idx, 1);
            await saveToCloud();
        };

        function openSheet(idx, item) {
            document.getElementById('sheet-name').innerText = item.name;
            document.getElementById('sheet-overlay').style.display = 'flex';
            document.getElementById('sheet-nav-btn').onclick = () => {
                if (!item.address) alert("此項目無地址資訊");
                else window.open(`https://map.naver.com/v5/search/${encodeURIComponent(item.address)}`, '_blank');
                closeSheet();
            };
            document.getElementById('sheet-edit-btn').onclick = () => { closeSheet(); window.openEdit(idx); };
            document.getElementById('sheet-del-btn').onclick = () => {
                if (confirm(`確定刪除「${item.name}」？`)) window.deleteItem(idx);
                closeSheet();
            };
        }

        window.closeSheet = () => document.getElementById('sheet-overlay').style.display = 'none';
        window.closeModal = () => document.getElementById('modal-overlay').style.display = 'none';

        async function startApp() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) { console.error("Auth Error:", err); }

            onAuthStateChanged(auth, (user) => {
                if (!user) return;
                state.currentUser = user;
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'itinerary', 'main');
                onSnapshot(docRef, (snapshot) => {
                    if (snapshot.exists()) { state.appData = snapshot.data(); } 
                    else { state.appData = initialData; saveToCloud(); }
                    render();
                });
            });
        }

        window.onload = startApp;
    </script>

    <style>
        :root {
            /* 莫蘭迪調色盤 */
            --bg: #F0F4F8; /* 淺藍灰背景 */
            --accent: #A3B1C6; /* 莫蘭迪淺藍強調 */
            --yellow-soft: #FEF9E7; /* 莫蘭迪柔黃 */
            --text: #5D6D7E; /* 深灰藍文字 */
            --white: #FFFFFF;
            --shadow: 0 4px 15px rgba(163, 177, 198, 0.2);
            --border: #E1E8ED;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Poppins', 'Noto Sans TC', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; }
        .container { max-width: 480px; margin: 0 auto; padding-bottom: 80px; }
        header { text-align: center; margin-bottom: 20px; }
        header h1 { font-size: 24px; margin: 0; letter-spacing: 3px; font-weight: 700; color: var(--accent); }
        header p { font-size: 11px; color: #ABB2B9; margin-top: 5px; }
        
        /* 導覽列優化：縮小按鈕 */
        .nav-scroller { display: flex; gap: 8px; overflow-x: auto; padding: 5px 0 15px 0; position: sticky; top: 0; background: var(--bg); z-index: 100; scrollbar-width: none; margin-bottom: 15px; }
        .nav-scroller::-webkit-scrollbar { display: none; }
        .nav-btn { border: 1px solid var(--border); background: var(--white); padding: 8px 12px; border-radius: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; color: #95A5A6; font-size: 12px; transition: all 0.3s; flex-shrink: 0; min-width: 60px; text-align: center; }
        .nav-btn.active { background: var(--accent); color: var(--white); border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow); }
        
        /* 卡片區域 */
        .card { background: var(--white); border-radius: 25px; padding: 20px; box-shadow: var(--shadow); border: 1px solid var(--border); }
        .section-header { font-weight: 700; margin-bottom: 20px; font-size: 17px; color: var(--accent); display: flex; align-items: center; gap: 8px; }
        
        /* 行程項目 */
        .item-row { display: flex; align-items: center; padding: 18px 0; border-bottom: 1px solid #F7F9FB; cursor: pointer; transition: background 0.2s; }
        .item-row:last-child { border-bottom: none; }
        .drag-handle { color: #D5DBDB; display: flex; flex-direction: column; gap: 3px; padding-right: 12px; }
        .drag-handle span { width: 14px; height: 2px; background: #D5DBDB; border-radius: 2px; }
        .time-label { width: 60px; font-weight: 700; font-size: 13px; color: var(--accent); }
        .content-box { flex: 1; padding-right: 10px; min-width: 0; }
        .item-name { font-size: 15px; font-weight: 600; color: #2C3E50; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-desc { font-size: 11px; color: #AAB7B8; margin-top: 4px; line-height: 1.4; }
        .tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .tag { font-size: 10px; background: var(--yellow-soft); padding: 3px 8px; border-radius: 6px; color: #D4AC0D; font-weight: 600; border: 1px solid #F9E79F; }
        .emoji-icon { font-size: 20px; width: 30px; text-align: right; }

        /* 浮動按鈕區域 */
        .fab-container { position: fixed; bottom: 25px; right: 20px; display: flex; flex-direction: column; gap: 12px; z-index: 500; }
        .fab { width: 56px; height: 56px; background: var(--accent); color: var(--white); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 8px 20px rgba(163, 177, 198, 0.4); cursor: pointer; transition: transform 0.3s; }
        .fab.currency-btn { background: var(--yellow-soft); color: #D4AC0D; font-size: 22px; border: 1px solid #F9E79F; }
        .fab:active { transform: scale(0.9); }

        /* 彈窗與單據 */
        .sheet-overlay, .modal-overlay { position: fixed; inset: 0; background: rgba(93, 109, 126, 0.4); backdrop-filter: blur(4px); display: none; z-index: 1000; align-items: flex-end; }
        .modal-overlay { align-items: center; justify-content: center; padding: 20px; }
        .sheet, .modal { background: var(--white); width: 100%; max-width: 480px; padding: 30px; border-radius: 30px 30px 0 0; border-top: 2px solid var(--accent); }
        .modal { border-radius: 30px; max-height: 85vh; overflow-y: auto; border: 1px solid var(--border); }
        
        .btn-action { width: 100%; padding: 16px; border-radius: 18px; border: none; font-weight: 700; margin-top: 12px; cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 10px; transition: all 0.3s; }
        .btn-action:active { transform: scale(0.98); }
        
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 12px; font-weight: 700; color: var(--accent); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
        .form-group input, .form-group textarea { width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: 15px; font-size: 14px; background: #FDFEFE; color: var(--text); outline: none; transition: border-color 0.3s; }
        .form-group input:focus { border-color: var(--accent); }

        .empty-state { padding: 40px 0; text-align: center; color: #BDC3C7; font-size: 14px; }
        .sortable-ghost { opacity: 0.3; background: var(--yellow-soft); }
    </style>
</head>
<body>

<div class="container">
    <header><h1>KOREA.2026</h1><p>莫蘭迪色系旅程 | 04.25 - 04.29</p></header>
    <nav class="nav-scroller" id="main-nav">
        <button class="nav-btn active" data-tab="1" onclick="switchTab('1')">Day 1</button>
        <button class="nav-btn" data-tab="2" onclick="switchTab('2')">Day 2</button>
        <button class="nav-btn" data-tab="3" onclick="switchTab('3')">Day 3</button>
        <button class="nav-btn" data-tab="4" onclick="switchTab('4')">Day 4</button>
        <button class="nav-btn" data-tab="5" onclick="switchTab('5')">Day 5</button>
        <button class="nav-btn" data-tab="start" onclick="switchTab('start')">行前</button>
        <button class="nav-btn" data-tab="heart" onclick="switchTab('heart')"><i class="fa-solid fa-heart"></i></button>
    </nav>
    <div id="content-area"></div>
</div>

<!-- 浮動按鈕群 -->
<div class="fab-container">
    <div class="fab currency-btn" onclick="window.open('https://xxx910616.github.io/Exchange-rate-calculator/', '_blank')">
        <i class="fa-solid fa-coins"></i>
    </div>
    <div class="fab" onclick="openEdit()"><i class="fa-solid fa-plus"></i></div>
</div>

<!-- 底部署標單 -->
<div class="sheet-overlay" id="sheet-overlay" onclick="closeSheet()">
    <div class="sheet" onclick="event.stopPropagation()">
        <div id="sheet-name" style="font-size:20px; font-weight:700; margin-bottom:25px; text-align:center; color:#2C3E50;"></div>
        <button class="btn-action" id="sheet-nav-btn" style="background:var(--accent); color:var(--white); box-shadow: var(--shadow);"><i class="fa-solid fa-location-arrow"></i> Naver Map 導航</button>
        <button class="btn-action" id="sheet-edit-btn" style="background:var(--white); border: 1px solid var(--border); color: var(--text);"><i class="fa-solid fa-pen"></i> 編輯行程內容</button>
        <button class="btn-action" id="sheet-del-btn" style="background:#FDEDEC; color:#E74C3C;"><i class="fa-solid fa-trash"></i> 刪除此項目</button>
    </div>
</div>

<!-- 編輯彈窗 -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
        <div style="font-size:18px; font-weight:700; margin-bottom:25px; color: var(--accent);">編輯行程項目</div>
        <div class="form-group"><label>項目名稱 *</label><input type="text" id="in-name"></div>
        <div style="display:flex; gap:12px;">
            <div class="form-group" style="flex:2;"><label>預計時間</label><input type="text" id="in-time" placeholder="例如 14:00"></div>
            <div class="form-group" style="flex:1;"><label>Emoji</label><input type="text" id="in-emoji"></div>
        </div>
        <div class="form-group"><label>韓國地址 / 店名</label><input type="text" id="in-address"></div>
        <div style="display:flex; gap:12px;">
            <div class="form-group" style="flex:1;"><label>交通方式</label><input type="text" id="in-transport"></div>
            <div class="form-group" style="flex:1;"><label>費用備註</label><input type="text" id="in-money"></div>
        </div>
        <div class="form-group"><label>詳細描述</label><textarea id="in-detail" rows="2"></textarea></div>
        <button class="btn-action" style="background:var(--accent); color:var(--white); box-shadow: var(--shadow);" onclick="saveEdit()">儲存行程更新</button>
        <button class="btn-action" style="background:none; color:#ABB2B9; font-size:13px;" onclick="closeModal()">取消返回</button>
    </div>
</div>

</body>
</html>
