<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KOREA 🫧 - 2026 旅遊助手</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <style>
        :root {
            --light-blue: #f0f4f8;
            --soft-yellow: #fef9c3;
            --white: #FFFFFF;
            --accent-blue: #5a7d9a;
            --accent-purple: #8e8da4;
            --accent-pink: #c89696;
            --accent-green: #8ca38a;
            --text-dark: #334155;
            --text-gray: #708090;
            --danger: #b36b6b;
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            outline: none;
        }

        body {
            font-family: 'Noto Sans TC', 'Poppins', sans-serif;
            background-color: var(--light-blue);
            background-image: linear-gradient(135deg, #e2e8f0 0%, #f1f5f9 100%);
            margin: 0; padding: 0; min-height: 100vh;
            color: var(--text-dark); overflow-x: hidden;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .container { max-width: 480px; margin: 0 auto; padding: 20px 20px 100px 20px; }

        header { text-align: center; margin-bottom: 25px; padding-top: 10px; }
        header h1 { font-size: 32px; font-weight: 700; color: var(--accent-blue); margin: 0; letter-spacing: 2px; }
        header p { font-size: 14px; font-weight: 600; color: var(--text-gray); letter-spacing: 1px; margin-top: 5px; opacity: 0.8; }

        .nav-scroller {
            background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px);
            border-radius: 25px; padding: 4px; 
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            position: sticky; top: 15px; z-index: 100;
            box-shadow: var(--card-shadow); margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .nav-btn {
            border: none; background: none; padding: 12px 0;
            font-size: 13px; font-weight: 700; color: var(--text-gray);
            border-radius: 20px; cursor: pointer; transition: all 0.3s ease;
            display: flex; align-items: center; justify-content: center;
        }

        .nav-btn.active { 
            background: var(--soft-yellow); 
            color: var(--accent-blue); 
            box-shadow: 0 4px 12px rgba(254, 249, 195, 0.5); 
        }
        
        .nav-btn.btn-pocket { color: #9ca3af; font-size: 18px; }
        .nav-btn.btn-pocket.active { 
            background: var(--soft-yellow); 
            color: var(--accent-blue); 
            box-shadow: 0 4px 12px rgba(254, 249, 195, 0.5); 
        }

        .card {
            background: rgba(255, 255, 255, 0.85); border-radius: 24px; padding: 20px;
            box-shadow: var(--card-shadow); margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .section-title { font-size: 16px; font-weight: 700; color: var(--accent-blue); margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }

        .filter-tags { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 20px; padding-bottom: 5px; scrollbar-width: none; }
        .filter-tags::-webkit-scrollbar { display: none; }
        
        .tag-pill {
            flex: 0 0 auto; padding: 6px 14px; border-radius: 20px; background: #e2e8f0;
            color: var(--text-gray); font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid #cbd5e1;
        }
        .tag-pill.active { background: var(--accent-purple); color: white; border-color: var(--accent-purple); }

        .item-list { display: flex; flex-direction: column; gap: 12px; min-height: 50px; }

        .item-row {
            background: rgba(248, 250, 252, 0.6); border-radius: 18px; padding: 15px;
            display: flex; align-items: center; gap: 12px; cursor: grab;
            transition: all 0.2s ease; border: 1px solid rgba(226, 232, 240, 0.8);
            user-select: none;
        }

        .item-row:active { cursor: grabbing; transform: scale(0.98); }
        .sortable-ghost { opacity: 0.4; background: var(--soft-yellow); border: 2px dashed var(--accent-blue); }

        .time-box { width: 45px; text-align: center; font-size: 12px; font-weight: 800; color: var(--accent-blue); border-right: 1px solid #e2e8f0; padding-right: 8px; }
        .time-box.hidden { display: none; }
        
        .content-box { flex: 1; }
        .item-name { font-size: 14px; font-weight: 700; margin-bottom: 4px; color: var(--text-dark); line-height: 1.4; }
        .item-desc { font-size: 11px; color: var(--text-gray); margin-bottom: 4px; }
        .item-meta { font-size: 10px; color: var(--text-gray); display: flex; flex-wrap: wrap; gap: 6px; }
        
        .meta-tag { background: #cbd5e1; color: #475569; padding: 2px 6px; border-radius: 6px; font-weight: 500; display: inline-flex; align-items: center; gap: 3px; }
        .meta-tag.tag-area { background: #d1d5db; color: #374151; }

        .drag-handle { color: #cbd5e1; font-size: 12px; cursor: grab; padding-right: 4px; }

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(51, 65, 85, 0.6);
            backdrop-filter: blur(6px); display: none; z-index: 1000;
            align-items: center; justify-content: center; padding: 20px;
        }

        .modal {
            background: var(--white); width: 100%; max-width: 420px;
            border-radius: 32px; padding: 25px; position: relative;
            max-height: 85vh; overflow-y: auto;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes modalPop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .modal-close { position: absolute; top: 20px; right: 20px; font-size: 24px; color: var(--text-gray); cursor: pointer; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; }

        .btn-naver {
            display: block; width: 100%; background: #607d8b; color: white;
            text-align: center; padding: 14px; border-radius: 16px;
            text-decoration: none; font-weight: 700; margin-top: 15px; border: none; cursor: pointer;
        }

        .btn-action {
            width: 100%; border: none; padding: 12px; border-radius: 12px;
            font-weight: bold; cursor: pointer; margin-top: 10px; font-family: inherit; transition: opacity 0.2s;
        }
        .btn-action:active { opacity: 0.7; }

        .fab-group {
            position: fixed; bottom: 30px; right: 25px; 
            display: flex; flex-direction: column; gap: 15px;
            z-index: 200;
        }

        .btn-fab {
            width: 56px; height: 56px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            cursor: pointer; border: none; transition: transform 0.2s ease;
            text-decoration: none;
        }

        .btn-fab:active { transform: scale(0.9); }
        .btn-exchange { background: var(--accent-green); color: white; font-weight: 700; font-size: 24px; }
        .btn-add { background: var(--accent-blue); color: white; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 11px; font-weight: 700; color: var(--text-gray); margin-bottom: 4px; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #cbd5e1; outline: none; font-family: inherit; font-size: 14px; background: #f8fafc;
        }
        
        /* 修正重疊問題的關鍵佈局 */
        .form-row-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
         }

        .hidden { display: none !important; }

        .confirm-dialog { text-align: center; padding: 10px 5px; }
        .confirm-title { font-size: 18px; font-weight: 700; color: var(--danger); margin-bottom: 10px; }
        .confirm-btns { display: flex; gap: 10px; margin-top: 25px; }
        .btn-cancel { background: #e2e8f0; color: var(--text-gray); flex: 1; }
        .btn-confirm-del { background: var(--danger); color: white; flex: 1; }
    </style>
</head>
<body>

<div class="container">

<div class="fab-group">

</div>

<script>

    const defaultData = {

            { id: 's7', name: '🏨 Aank Hotel Yeondengpo', detail: '서울 영등포구 영중로10길 10', emoji: '🏨', address: '서울 영등포구 영중로10길 10' }
        ],
        days: {
            1: [
                { id: 'd1-1', time: '21:35', name: '抵達仁川 🛬', address: 'ICN Airport', transport: '17:55-21:35', emoji: '🛫' },
                { id: 'd1-2', time: '22:30', name: '飯店 Check-in', address: '서울 영등포구 영중로10길 10', transport: '機場接送', money: '₩13000/人', emoji: '🏨' },
                { id: 'd1-3', time: '23:30', name: '東大門批發 (The mask shop / APM / Nyunyu)', address: '서울 中區 退溪路73街 36 1層', transport: '公車 / UBER', emoji: '🛍️', area: '東大門' },
                { id: 'd1-4', time: '01:00', name: '🥩 大成精肉店 대성정육식당', address: '서울 용산구 서빙고로95길 22', transport: 'UBER', money: '₩20000/人', emoji: '🥩' },
                { id: 'd1-5', time: '02:30', name: '回飯店休息', address: '서울 영등포구 영중로10길 10 아늑호텔 영등포점', transport: 'UBER / 夜間公車', emoji: '🛌' }
            ],
            2: [
                { id: 'd2-1', time: '09:00', name: '景福宮 경복궁', address: '서울특별시 종羅구 사직로 161', transport: '地鐵 5 號線', emoji: '🏛️' },
                { id: 'd2-2', time: '10:00', name: '藝人韓服預約 ✅', address: '서울 종羅區 자하문로1가길 5 . 3層', transport: '🚶🏻‍➡️ 步行', money: 'TWD 245', emoji: '👘' },
                { id: 'd2-3', time: '12:30', name: '🦀 順美家幸福的醬蟹 순미네행복게장', address: '서울 中區 乙支路43街 38 2層', transport: '地鐵 / 🚶🏻‍➡️', emoji: '🦀', area: '東大門' },
                { id: 'd2-4', time: '14:00', name: '🐔 孔陵一隻雞 공陵닭한마리', address: '서울 종羅區 종羅40가길 20', transport: '🚶🏻‍➡️ 步行', emoji: '🍗' },
                { id: 'd2-5', time: '15:30', name: '廣藏市場 🍢', address: '서울특별시 종로구 창경궁로 88', transport: '🚶🏻‍➡️ 步行', emoji: '🍢', area: '廣藏' },
                { id: 'd2-6', time: '16:30', name: '明洞 + 樂天百貨', address: '서울특별시 중구 명動2家', transport: '地鐵 / 公車', emoji: '🏙️', area: '明洞' },
                { id: 'd2-7', time: '18:30', name: '首爾車站樂天超市', address: '서울 中區 漢江大路 405', transport: '地鐵 / 公車', emoji: '🛒' },
                { id: 'd2-8', time: '20:00', name: '🥩 明倫進士燒烤 명倫진사갈비', address: '서울 영등포구 영중로10길 20', transport: '🚶🏻‍➡️ 步行', money: '₩21900/人', emoji: '🥩' }
            ],
            3: [
                { id: 'd3-1', time: '10:00', name: '出發漢南洞', address: '서울 용산구 이태元로54가길 4', transport: '地鐵 5 轉 6 號線', emoji: '🚇', area: '漢南洞' },
                { id: 'd3-2', time: '12:00', name: '🐷 安木豬肉湯飯 안목 성수국밥', address: '서울 성동구 뚝섬로13길 34 1層', transport: '地鐵 2 號線', money: '₩13000/人', emoji: '🐷', area: '聖水洞' },
                { id: 'd3-3', time: '13:30', name: '聖水洞逛街 (Dior/Ader/etc)', address: '서울 성동구 연務章11길 19', transport: '🚶🏻‍➡️ 步行', emoji: '☕', area: '聖水洞' },
                { id: 'd3-4', time: '18:00', name: '🍜 JOJO 刀削麵 조조칼국수', address: '서울 성동구 성수일路8길 55 1層', transport: '🚶🏻‍➡️ 步行', money: '₩10000/人', emoji: '🍜', area: '聖水洞' }
            ],
            4: [
                { id: 'd4-1', time: '09:00', name: '專車出發 🎢', transport: '預約專車接送', emoji: '🚐' },
                { id: 'd4-2', time: '10:00', name: '愛寶樂園 에버랜드', address: '경기도 용인시 처인구 포곡읍 에버랜드로 199', emoji: '🎢' },
                { id: 'd4-3', time: '16:00', name: '醫美行程 (弘大)', address: '서울 마포구', transport: '專車 / UBER', emoji: '🏥', area: '弘大' },
                { id: 'd4-4', time: '18:00', name: '🐙 Hongs Zzuggumi 辣炒章魚', address: '서울 마포구 어울마당로 146', transport: '🚶🏻‍➡️ 步行', money: '₩16000/人', emoji: '🐙', area: '弘大' },
                { id: 'd4-5', time: '22:30', name: 'GOP 곱牛腸 文來本底', address: '서울 영등포구 당산로 34 118號', transport: '地鐵 / UBER', money: '₩11500/人起', emoji: '🥘' }
            ],
            5: [
                { id: 'd5-1', time: '10:30', name: '出發往機場 🛫', address: 'ICN Airport', emoji: '✈️' },
                { id: 'd5-2', time: '14:45', name: '搭機返台', transport: '航班回程', emoji: '🇹🇼' }
            ]
        },
        pockets: [] 
    };

    let userItinerary = JSON.parse(localStorage.getItem('korea_travel_v12')) || defaultData;
    let currentTab = 'start';
    let currentPocketFilter = '全部';
    let sortableInstance = null;

    function render() {
        const area = document.getElementById('content-area');
        area.innerHTML = '';
        const card = document.createElement('div');
        card.className = 'card';
        
        let titleHtml = '';
        if (currentTab === 'start') titleHtml = '<i class="fa-solid fa-clipboard-check"></i> 行前備忘與預約';
        else if (currentTab === 'pockets') titleHtml = `<i class="fa-solid fa-heart" style="color:var(--text-gray)"></i> 我的收藏`;
        else titleHtml = `<i class="fa-solid fa-calendar-day"></i> Day ${currentTab} 行程`;

        card.innerHTML = `<div class="section-title">${titleHtml}</div>`;

        if (currentTab === 'pockets') {
            const filterDiv = document.createElement('div');
            filterDiv.className = 'filter-tags';
            pocketTags.forEach(tag => {
                const span = document.createElement('span');
                span.className = `tag-pill ${currentPocketFilter === tag ? 'active' : ''}`;
                span.innerText = tag;
                span.onclick = (e) => {
                    e.stopPropagation();
                    currentPocketFilter = tag;
                    render();
                };
                filterDiv.appendChild(span);
            });
            card.appendChild(filterDiv);
        }

        const list = document.createElement('div');
        list.className = 'item-list';
        list.id = 'draggable-list';
        
        let items = [];
        if (currentTab === 'start') {
            items = userItinerary.start || [];
        } else if (currentTab === 'pockets') {
            items = userItinerary.pockets || [];
            if (currentPocketFilter !== '全部') {
                items = items.filter(i => i.area === currentPocketFilter);
            }
        } else {
            items = userItinerary.days[currentTab] || [];
        }

        items.forEach((item, index) => {
            const row = document.createElement('div');
            row.className = 'item-row';
            row.dataset.id = item.id || `temp-${index}`;
            row.onclick = () => showDetail(item, index);
            
            const isStartTab = (currentTab === 'start');
            const isPocketTab = (currentTab === 'pockets');
            
            row.innerHTML = `
                <div class="drag-handle"><i class="fa-solid fa-grip-vertical"></i></div>
                <div class="time-box ${isStartTab || isPocketTab ? 'hidden' : ''}">${item.time || '--:--'}</div>
                <div class="content-box">
                    <div class="item-name">${item.name}</div>
                    ${isStartTab && item.detail ? `<div class="item-desc">${item.detail}</div>` : ''}
                    <div class="item-meta">
                        ${item.area ? `<span class="meta-tag tag-area"><i class="fa-solid fa-location-dot"></i> ${item.area}</span>` : ''}
                        ${item.transport ? `<span class="meta-tag"><i class="fa-solid fa-bus"></i> ${item.transport}</span>` : ''}
                        ${item.money ? `<span class="meta-tag"><i class="fa-solid fa-won-sign"></i> ${item.money}</span>` : ''}
                        ${!isStartTab && item.detail ? `<span class="meta-tag"><i class="fa-solid fa-note-sticky"></i> 備註</span>` : ''}
                    </div>
                </div>
                <div class="emoji-box" style="font-size:20px">${item.emoji || '📍'}</div>
            `;
            list.appendChild(row);
        });

        if (items.length === 0) {
            list.innerHTML = `<div style="padding:40px 0; text-align:center; color:var(--text-gray); font-size:14px; opacity: 0.6;">尚無資料</div>`;
        }

        card.appendChild(list);
        area.appendChild(card);

        if (items.length > 0) {
            initSortable(list);
        }
    }

    function initSortable(el) {
        if (sortableInstance) sortableInstance.destroy();
        const isFilteredPocket = currentTab === 'pockets' && currentPocketFilter !== '全部';
        sortableInstance = new Sortable(el, {
            animation: 150,
            handle: '.drag-handle',
            ghostClass: 'sortable-ghost',
            disabled: isFilteredPocket,
            onEnd: function (evt) {
                const oldIndex = evt.oldIndex;
                const newIndex = evt.newIndex;
                if (oldIndex === newIndex) return;
                if (currentTab === 'start') {
                    const movedItem = userItinerary.start.splice(oldIndex, 1)[0];
                    userItinerary.start.splice(newIndex, 0, movedItem);
                } else if (currentTab === 'pockets') {
                    const movedItem = userItinerary.pockets.splice(oldIndex, 1)[0];
                    userItinerary.pockets.splice(newIndex, 0, movedItem);
                } else {
                    const movedItem = userItinerary.days[currentTab].splice(oldIndex, 1)[0];
                    userItinerary.days[currentTab].splice(newIndex, 0, movedItem);
                }
                save();
            }
        });
    }

    function showDetail(item, actualIndex) {
        const modal = document.getElementById('modal-container');
        const content = document.getElementById('modal-content');
        const naverUrl = item.address ? `https://map.naver.com/v5/search/${encodeURIComponent(item.address)}` : null;

        content.innerHTML = `
            <span class="modal-close" id="close-modal-btn">&times;</span>
            <div style="text-align:center; margin-bottom:20px">
                <div style="font-size:54px; margin-bottom:10px">${item.emoji || '📍'}</div>
                <h2 style="margin:5px 0; color:var(--accent-blue); font-size:20px">${item.name}</h2>
            </div>
            <div style="font-size:14px; line-height:1.7; color:var(--text-gray); background:#f1f5f9; padding:18px; border-radius:20px; border: 1px solid #e2e8f0">
                ${item.area ? `<b>🏙️ 區域：</b> <span style="color:var(--accent-purple); font-weight:bold">${item.area}</span><br>` : ''}
                ${(!['start', 'pockets'].includes(currentTab) && item.time) ? `<b>🕒 時間：</b> ${item.time}<br>` : ''}
                ${item.transport ? `<b>🚍 交通：</b> ${item.transport}<br>` : ''}
                ${item.money ? `<b>💰 費用：</b> ${item.money}<br>` : ''}
                ${item.detail ? `<b>ℹ️ 備註：</b> ${item.detail}<br>` : ''}
                ${item.address ? `<b>📍 地址：</b><br><span style="font-size:12px; color:var(--text-dark); word-break:break-all">${item.address}</span>` : ''}
            </div>
            ${naverUrl ? `<a href="${naverUrl}" target="_blank" class="btn-naver"><i class="fa-solid fa-map-location-dot"></i> 在 NAVER 地圖查看</a>` : ''}
            <div style="display:flex; gap:10px; margin-top:12px">
                <button class="btn-action" style="flex:1; background:var(--light-blue); color:var(--accent-blue)" id="edit-item-btn">編輯</button>
                <button class="btn-action" style="flex:1; background:#fecaca; color:var(--danger)" id="ask-delete-btn">刪除</button>
            </div>
        `;
        
        modal.style.display = 'flex';
        document.getElementById('close-modal-btn').onclick = closeModal;
        document.getElementById('edit-item-btn').onclick = () => showEditForm(item, actualIndex);
        document.getElementById('ask-delete-btn').onclick = () => showConfirmDelete(item, actualIndex);
    }

    function showConfirmDelete(item, index) {
        const content = document.getElementById('modal-content');
        content.innerHTML = `
            <div class="confirm-dialog">
                <div style="font-size:40px; margin-bottom:15px">⚠️</div>
                <div class="confirm-title">確定要刪除嗎？</div>
                <p style="color:var(--text-gray); font-size:14px">此操作無法復原，請確認是否繼續。</p>
                <div class="confirm-btns">
                    <button class="btn-action btn-cancel" id="cancel-del-btn">取消</button>
                    <button class="btn-action btn-confirm-del" id="real-delete-btn">確認刪除</button>
                </div>
            </div>
        `;
        document.getElementById('cancel-del-btn').onclick = () => showDetail(item, index);
        document.getElementById('real-delete-btn').onclick = () => execDelete(index);
    }

    function execDelete(index) {
        if (currentTab === 'start') userItinerary.start.splice(index, 1);
        else if (currentTab === 'pockets') userItinerary.pockets.splice(index, 1);
        else if (userItinerary.days[currentTab]) userItinerary.days[currentTab].splice(index, 1);
        save();
        closeModal();
    }

    function showEditForm(item, index) {
        const content = document.getElementById('modal-content');
        const isPocketOrStart = currentTab === 'pockets' || currentTab === 'start';

        content.innerHTML = `
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <h3 style="margin:0 0 18px 0; color:var(--accent-blue); font-size:18px">
                ${index === -1 ? '新增' : '編輯'}${currentTab === 'pockets' ? '口袋地點' : (currentTab === 'start' ? '行前備忘' : '行程')}
            </h3>
            <div class="form-group">
                <label>名稱 *</label>
                <input type="text" id="edit-name" value="${item.name || ''}" placeholder="例如：大成精肉店">
            </div>
            <div class="form-group">
                <label>區域標籤</label>
                <select id="edit-area">
                    <option value="">(不選取)</option>
                    ${pocketTags.filter(t => t !== '全部').map(tag => `<option value="${tag}" ${item.area === tag ? 'selected' : ''}>${tag}</option>`).join('')}
                </select>
            </div>
            
            <!-- 使用 Grid 修正重疊問題 -->
            <div class="form-row-grid">
                <div class="${isPocketOrStart ? 'hidden' : ''}">
                    <label style="display:block; font-size:11px; font-weight:700; color:var(--text-gray); margin-bottom:4px;">預計時間</label>
                    <input type="time" id="edit-time" value="${item.time || '10:00'}" style="width:100%; padding:12px; border-radius:10px; border:1px solid #cbd5e1; font-family:inherit;">
                </div>
                <div style="${isPocketOrStart ? 'grid-column: span 2;' : ''}">
                    <label style="display:block; font-size:11px; font-weight:700; color:var(--text-gray); margin-bottom:4px;">Emoji 圖示</label>
                    <input type="text" id="edit-emoji" value="${item.emoji || '📍'}" style="width:100%; padding:12px; border-radius:10px; border:1px solid #cbd5e1; font-family:inherit;">
                </div>
            </div>

            <div class="form-group">
                <label>韓文地址</label>
                <input type="text" id="edit-address" value="${item.address || ''}" placeholder="서울 중구...">
            </div>
            <div class="form-group">
                <label>交通方式 / 預算預估</label>
                <input type="text" id="edit-transport" value="${item.transport || ''}" placeholder="地鐵 / ₩20000">
            </div>
            <div class="form-group">
                <label>詳細備註</label>
                <textarea id="edit-detail" rows="3" placeholder="補充資訊...">${item.detail || ''}</textarea>
            </div>
            <button class="btn-naver" style="background:var(--accent-blue); margin-bottom: 10px;" id="save-item-btn">儲存變更</button>
            <div style="text-align: center;">
                <button class="btn-action" style="background:none; color:var(--text-gray); margin:0; padding: 5px; font-size: 14px; width: auto;" onclick="closeModal()">取消</button>
            </div>
        `;

        document.getElementById('save-item-btn').onclick = () => saveEdit(index, item.id);
    }

    function saveEdit(index, existingId) {
        const nameInput = document.getElementById('edit-name');
        if (!nameInput || !nameInput.value.trim()) {
            if (nameInput) nameInput.style.borderColor = 'var(--danger)';
            return;
        }
        const updated = {
            id: existingId || Date.now().toString(),
            name: nameInput.value,
            time: document.getElementById('edit-time')?.value || '',
            emoji: document.getElementById('edit-emoji').value || '📍',
            address: document.getElementById('edit-address').value,
            transport: document.getElementById('edit-transport').value,
            detail: document.getElementById('edit-detail').value,
            area: document.getElementById('edit-area').value
        };
        if (index === -1) {
            if (currentTab === 'start') {
                if(!userItinerary.start) userItinerary.start = [];
                userItinerary.start.push(updated);
            } else if (currentTab === 'pockets') {
                if(!userItinerary.pockets) userItinerary.pockets = [];
                userItinerary.pockets.push(updated);
            } else {
                if (!userItinerary.days[currentTab]) userItinerary.days[currentTab] = [];
                userItinerary.days[currentTab].push(updated);
            }
        } else {
            if (currentTab === 'start') userItinerary.start[index] = updated;
            else if (currentTab === 'pockets') userItinerary.pockets[index] = updated;
            else userItinerary.days[currentTab][index] = updated;
        }
        save();
        closeModal();
    }

    function save() {
        localStorage.setItem('korea_travel_v12', JSON.stringify(userItinerary));
        render();
    }

    function closeModal() { 
        document.getElementById('modal-container').style.display = 'none'; 
    }

    document.getElementById('main-nav').addEventListener('click', (e) => {
        const btn = e.target.closest('.nav-btn');
        if (!btn) return;
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTab = btn.dataset.tab;
        currentPocketFilter = '全部';
        render();
    });

    document.getElementById('open-add-btn').onclick = () => {
        const item = { name: '', time: '10:00', emoji: '📍', address: '', transport: '', detail: '', area: '' };
        showEditForm(item, -1);
        document.getElementById('modal-container').style.display = 'flex';
    };

    window.onclick = (e) => { if(e.target.id === 'modal-container') closeModal(); };
    window.onload = render;
</script>
</body>
</html>
