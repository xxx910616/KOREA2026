<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KOREA.2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(180deg, #eef3f7 0%, #f8fbfc 100%);
            --card-bg: #ffffff;
            --accent-blue: #7a92a5;
            --text-main: #4a5568;
            --text-light: #94a3b8;
            --tag-bg: #f1f5f9;
            --active-yellow: #fff9c4;
            --shadow: 0 10px 25px rgba(149, 157, 165, 0.08);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

        body {
            font-family: 'Poppins', 'Noto Sans TC', sans-serif;
            background: var(--bg-gradient);
            margin: 0; padding: 0; color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container { max-width: 480px; margin: 0 auto; padding: 30px 15px 100px 15px; }

        header { text-align: center; margin-bottom: 25px; }
        header h1 { font-size: 26px; font-weight: 700; color: var(--accent-blue); margin: 0; letter-spacing: 2px; }
        header p { font-size: 12px; color: var(--text-light); margin-top: 5px; }

        .nav-scroller {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 30px; padding: 5px;
            display: flex; justify-content: space-between;
            position: sticky; top: 15px; z-index: 1000;
            box-shadow: var(--shadow); margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.3);
            overflow-x: auto;
            scrollbar-width: none;
        }
        .nav-scroller::-webkit-scrollbar { display: none; }

        .nav-btn {
            border: none; background: none; flex-shrink: 0;
            padding: 10px 15px; font-size: 12px; font-weight: 700;
            color: var(--text-light); border-radius: 25px;
            cursor: pointer; transition: all 0.2s ease;
        }

        .nav-btn.active { 
            background: var(--active-yellow); color: #5a6a7a;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .filter-scroller {
            display: flex; gap: 8px; overflow-x: auto;
            margin-bottom: 15px; padding-bottom: 5px;
            scrollbar-width: none;
        }
        .filter-scroller::-webkit-scrollbar { display: none; }
        .filter-chip {
            white-space: nowrap; padding: 6px 14px; border-radius: 20px;
            background: #fff; border: 1px solid #e2e8f0; font-size: 12px;
            color: #64748b; cursor: pointer; transition: all 0.2s;
        }
        .filter-chip.active {
            background: var(--accent-blue); color: white; border-color: var(--accent-blue);
        }

        .card {
            background: var(--card-bg); border-radius: 30px; padding: 20px;
            box-shadow: var(--shadow); margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.5);
        }

        .section-header { 
            font-size: 15px; font-weight: 700; color: var(--accent-blue); 
            margin-bottom: 18px; display: flex; align-items: center; gap: 8px;
        }

        .item-list { display: flex; flex-direction: column; gap: 10px; min-height: 50px; }

        .item-row {
            background: white; border-radius: 20px; padding: 14px;
            display: flex; align-items: center; gap: 10px;
            border: 1px solid #f1f5f9; cursor: pointer; position: relative;
            transition: transform 0.1s;
        }
        .sortable-ghost { opacity: 0.4; background: #e2e8f0; }
        .sortable-drag { opacity: 0.9; transform: scale(1.02); box-shadow: 0 15px 30px rgba(0,0,0,0.1); }

        .drag-handle { 
            color: #cbd5e1; 
            padding: 10px 5px;
            cursor: grab;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .drag-handle span { width: 12px; height: 2px; background: #cbd5e1; border-radius: 2px; }

        .time-label { font-size: 13px; font-weight: 700; color: var(--accent-blue); width: 45px; flex-shrink: 0; }
        .content-box { flex: 1; min-width: 0; }
        .item-name { font-size: 14px; font-weight: 600; color: #334155; margin-bottom: 3px; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-desc { font-size: 11px; color: var(--text-light); line-height: 1.3; }
        
        .tag-row { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
        .tag {
            background: var(--tag-bg); color: #64748b; padding: 2px 8px;
            border-radius: 6px; font-size: 10px; font-weight: 700;
            display: inline-flex; align-items: center; gap: 3px;
        }
        .emoji-icon { font-size: 20px; flex-shrink: 0; }

        .fab-group { position: fixed; bottom: 30px; right: 20px; display: flex; flex-direction: column; gap: 12px; z-index: 500; }
        .btn-fab {
            width: 54px; height: 54px; border-radius: 50%; border: none;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); cursor: pointer;
        }
        .btn-fab.add { background: #7a92a5; color: white; font-size: 22px; }

        .sheet-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px); display: none; z-index: 2000;
            align-items: flex-end;
        }
        .sheet {
            background: white; width: 100%; border-radius: 30px 30px 0 0;
            padding: 25px; animation: slideUp 0.3s ease; max-width: 480px; margin: 0 auto;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .sheet-title { font-size: 16px; font-weight: 700; color: var(--accent-blue); margin-bottom: 20px; text-align: center; }
        .sheet-options { display: flex; flex-direction: column; gap: 10px; }
        .sheet-btn {
            width: 100%; padding: 15px; border-radius: 16px; border: none;
            font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer;
        }
        .btn-nav { background: #e0f2fe; color: #0369a1; }
        .btn-edit { background: #fef9c3; color: #854d0e; }
        .btn-del { background: #fee2e2; color: #b91c1c; }
        .btn-cancel { background: #f1f5f9; color: #64748b; }

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.4);
            backdrop-filter: blur(8px); display: none; z-index: 3000;
            align-items: center; justify-content: center; padding: 15px;
        }
        .modal {
            background: white; width: 100%; max-width: 400px;
            border-radius: 30px; padding: 25px; position: relative;
            max-height: 85vh; overflow-y: auto;
        }
        .form-row { display: flex; gap: 10px; margin-bottom: 12px; }
        .form-group { margin-bottom: 12px; flex: 1; }
        .form-group label { display: block; font-size: 11px; font-weight: 700; color: #94a3b8; margin-bottom: 6px; }
        .form-group input, .form-group textarea {
            width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #e2e8f0; font-size: 14px; font-family: inherit;
        }
        .btn-save { width: 100%; background: #7a92a5; color: white; border: none; padding: 15px; border-radius: 15px; font-weight: 700; cursor: pointer; font-size: 15px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>KOREA.2026</h1>
        <p>2026.04.25 - 04.29</p>
    </header>

    <nav class="nav-scroller" id="main-nav">
        <button class="nav-btn active" data-tab="start">行前準備</button>
        <button class="nav-btn" data-tab="1">D1</button>
        <button class="nav-btn" data-tab="2">D2</button>
        <button class="nav-btn" data-tab="3">D3</button>
        <button class="nav-btn" data-tab="4">D4</button>
        <button class="nav-btn" data-tab="5">D5</button>
        <button class="nav-btn" data-tab="heart"><i class="fa-solid fa-heart"></i></button>
    </nav>

    <div id="content-area"></div>
</div>

<div class="fab-group">
    <button class="btn-fab add" id="add-btn"><i class="fa-solid fa-plus"></i></button>
</div>

<div class="sheet-overlay" id="sheet-overlay">
    <div class="sheet">

        <div class="sheet-options">
            <button class="sheet-btn btn-nav" id="sheet-nav-btn"><i class="fa-solid fa-location-arrow"></i> 導航 (Naver Map)</button>
            <button class="sheet-btn btn-edit" id="sheet-edit-btn"><i class="fa-solid fa-pen"></i> 編輯行程</button>
            <button class="sheet-btn btn-del" id="sheet-del-btn"><i class="fa-solid fa-trash"></i> 刪除項目</button>
            <button class="sheet-btn btn-cancel" onclick="closeSheet()">取消</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="modal-overlay">
    <div class="modal">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h2 id="modal-title" style="margin:0; font-size:18px; color:var(--accent-blue)">編輯內容</h2>
            <span onclick="closeModal()" style="cursor:pointer; font-size:24px; color:#cbd5e1">&times;</span>
        </div>
        <div class="form-group"><label>名稱 *</label><input type="text" id="in-name"></div>
        <div class="form-row">
            <div class="form-group"><label>時間</label><input type="time" id="in-time"></div>
            <div class="form-group"><label>Emoji</label><input type="text" id="in-emoji"></div>
        </div>
        <div class="form-group"><label>韓文名稱/地址</label><input type="text" id="in-address"></div>
        <div class="form-row">
            <div class="form-group"><label>交通方式</label><input type="text" id="in-transport"></div>
            <div class="form-group"><label>預算/金額</label><input type="text" id="in-money"></div>
        </div>
        <div class="form-group"><label>詳細備註</label><textarea id="in-detail" rows="3"></textarea></div>
        <button class="btn-save" id="save-btn">儲存變更</button>
    </div>
</div>

    let appData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || initialData;
    let activeTab = 'start';
    let currentFilter = '全部';
    let currentIndex = -1;

    function render() {
        const area = document.getElementById('content-area');
        area.innerHTML = '';
        
        if (activeTab === 'heart') {
            const filterDiv = document.createElement('div');
            filterDiv.className = 'filter-scroller';
            const categories = ['全部', '聖水洞', '明洞', '弘大'];
            categories.forEach(cat => {
                const chip = document.createElement('div');
                chip.className = `filter-chip ${currentFilter === cat ? 'active' : ''}`;
                chip.innerText = cat;
                chip.onclick = () => {
                    currentFilter = cat;
                    render();
                };
                filterDiv.appendChild(chip);
            });
            area.appendChild(filterDiv);
        }

        const card = document.createElement('div');
        card.className = 'card';

        let headerTxt = '';
        if (activeTab === 'start') headerTxt = '行前備忘';
        else if (activeTab === 'heart') headerTxt = '收藏清單';
        else headerTxt = `Day ${activeTab} 行程`;

        card.innerHTML = `<div class="section-header"><i class="fa-solid fa-calendar-day"></i> ${headerTxt}</div>`;

        const list = document.createElement('div');
        list.className = 'item-list';
        
        let items = (activeTab === 'start' || activeTab === 'heart') ? appData[activeTab] : appData.days[activeTab];
        
        if (activeTab === 'heart' && currentFilter !== '全部') {
            items = items.filter(i => 
                (i.name && i.name.includes(currentFilter)) || 
                (i.address && i.address.includes(currentFilter)) ||
                (i.detail && i.detail.includes(currentFilter))
            );
        }

        if (!items || items.length === 0) {
            list.innerHTML = `<div style="text-align:center; padding:40px; color:#cbd5e1; font-size:13px">尚未規劃${activeTab === 'heart' ? currentFilter : ''}項目</div>`;
        } else {
            items.forEach((item, idx) => {
                const row = document.createElement('div');
                row.className = 'item-row';
                row.innerHTML = `
                    <div class="drag-handle"><span></span><span></span><span></span></div>
                    ${item.time && activeTab !== 'start' ? `<div class="time-label">${item.time}</div>` : ''}
                    <div class="content-box" onclick="handleItemClick(${idx})">
                        <div class="item-name">${item.name}</div>
                        ${item.detail ? `<div class="item-desc">${item.detail}</div>` : ''}
                        <div class="tag-row">
                            ${item.transport ? `<span class="tag"><i class="fa-solid fa-bus"></i> ${item.transport}</span>` : ''}
                            ${item.money ? `<span class="tag"><i class="fa-solid fa-won-sign"></i> ${item.money}</span>` : ''}
                        </div>
                    </div>
                    <div class="emoji-icon" onclick="handleItemClick(${idx})">${item.emoji || '📍'}</div>
                `;
                list.appendChild(row);
            });
        }

        card.appendChild(list);
        area.appendChild(card);
        
        if (activeTab !== 'heart' || currentFilter === '全部') {
            new Sortable(list, { 
                handle: '.drag-handle',
                animation: 200,
                ghostClass: 'sortable-ghost',
                dragClass: 'sortable-drag',
                onEnd: (evt) => {
                    const arr = (activeTab === 'start' || activeTab === 'heart') ? appData[activeTab] : appData.days[activeTab];
                    const [moved] = arr.splice(evt.oldIndex, 1);
                    arr.splice(evt.newIndex, 0, moved);
                    save();
                }
            });
        }
    }

    function handleItemClick(idx) {
        const arr = (activeTab === 'start' || activeTab === 'heart') ? appData[activeTab] : appData.days[activeTab];
        let item;
        if (activeTab === 'heart' && currentFilter !== '全部') {
             item = appData.heart.filter(i => 
                (i.name && i.name.includes(currentFilter)) || 
                (i.address && i.address.includes(currentFilter)) ||
                (i.detail && i.detail.includes(currentFilter))
            )[idx];
            currentIndex = appData.heart.findIndex(i => i.id === item.id);
        } else {
            currentIndex = idx;
            item = arr[idx];
        }
        openSheet(currentIndex, item);
    }

    function openSheet(idx, item) {
        document.getElementById('sheet-name').innerText = item.name;
        document.getElementById('sheet-overlay').style.display = 'flex';

        document.getElementById('sheet-nav-btn').onclick = () => {
            if (!item.address) {
                alert("此行程無地址資訊，請編輯後導航");
            } else {
                let url = `https://map.naver.com/v5/search/${encodeURIComponent(item.address)}`;
                window.open(url, '_blank');
            }
            closeSheet();
        };

        document.getElementById('sheet-edit-btn').onclick = () => {
            closeSheet();
            openEdit(idx);
        };

        document.getElementById('sheet-del-btn').onclick = () => {
            if (confirm(`確定刪除「${item.name}」？`)) {
                const arr = (activeTab === 'start' || activeTab === 'heart') ? appData[activeTab] : appData.days[activeTab];
                arr.splice(idx, 1);
                save();
            }
            closeSheet();
        };
    }

    function closeSheet() { document.getElementById('sheet-overlay').style.display = 'none'; }

    function openEdit(idx = -1) {
        currentIndex = idx;
        const arr = (activeTab === 'start' || activeTab === 'heart') ? appData[activeTab] : appData.days[activeTab];
        const item = idx === -1 ? { name: '', emoji: '📍', time: '', address: '', detail: '', transport: '', money: '' } : arr[idx];

        document.getElementById('in-name').value = item.name || '';
        document.getElementById('in-emoji').value = item.emoji || '';
        document.getElementById('in-time').value = item.time || '';
        document.getElementById('in-address').value = item.address || '';
        document.getElementById('in-transport').value = item.transport || '';
        document.getElementById('in-money').value = item.money || '';
        document.getElementById('in-detail').value = item.detail || '';
        
        document.getElementById('modal-title').innerText = idx === -1 ? '新增項目' : '編輯行程';
        document.getElementById('modal-overlay').style.display = 'flex';
    }

    function saveEdit() {
        const name = document.getElementById('in-name').value;
        if (!name) return;

        const arr = (activeTab === 'start' || activeTab === 'heart') ? appData[activeTab] : appData.days[activeTab];
        const updated = {
            id: currentIndex === -1 ? Date.now().toString() : arr[currentIndex].id,
            name: name,
            emoji: document.getElementById('in-emoji').value,
            time: document.getElementById('in-time').value,
            address: document.getElementById('in-address').value,
            transport: document.getElementById('in-transport').value,
            money: document.getElementById('in-money').value,
            detail: document.getElementById('in-detail').value
        };

        if (currentIndex === -1) arr.push(updated);
        else arr[currentIndex] = updated;

        save();
        closeModal();
    }

    function save() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
        render();
    }

    function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }

    document.getElementById('main-nav').onclick = (e) => {
        const btn = e.target.closest('.nav-btn');
        if (!btn) return;
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeTab = btn.dataset.tab;
        currentFilter = '全部';
        render();
    };

    document.getElementById('add-btn').onclick = () => openEdit();
    document.getElementById('save-btn').onclick = saveEdit;

    window.onclick = (e) => {
        if (e.target.id === 'sheet-overlay') closeSheet();
        if (e.target.id === 'modal-overlay') closeModal();
    };

    window.onload = render;
</script>

</body>
</html>
